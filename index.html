<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#70c5ce">
<title>Flappy Bird</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;
  overflow:hidden;
  position:fixed;
  top:0;left:0;
  font-family:'Arial',sans-serif;
  touch-action:none;
  background:#70c5ce;
}
canvas{
  display:block;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
}
#tapbtn{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  width:80%;
  max-width:320px;
  height:72px;
  background:rgba(255,214,0,0.92);
  border:none;
  border-radius:36px;
  font-size:26px;
  font-weight:900;
  color:#333;
  letter-spacing:1px;
  cursor:pointer;
  z-index:10;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  box-shadow:0 6px 0 rgba(0,0,0,0.25);
  transition:transform 0.08s,box-shadow 0.08s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
#tapbtn:active{
  transform:translateX(-50%) translateY(4px);
  box-shadow:0 2px 0 rgba(0,0,0,0.25);
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="tapbtn">🐦 ТАП — ЛЕТЕТЬ</button>
<script>
if(window.Telegram&&window.Telegram.WebApp){
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}
document.body.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const tapBtn=document.getElementById('tapbtn');

let W,H;
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

// --- CONSTANTS ---
const PIPE_W=64;
const PIPE_GAP=170;
const PIPE_SPEED=2.6;
const GRAVITY=0.42;
const FLAP_POWER=-9;
const GROUND_H=80;
const PIPE_INTERVAL=120; // frames между трубами

// --- STATE ---
let state='start'; // start | play | dead
let bird,pipes,score,bestScore,frame,groundX;
let particles=[];
bestScore=0;

function initGame(){
  bird={
    x:W*0.28,
    y:H*0.45,
    vy:0,
    r:18,
    rot:0,
    flapped:false
  };
  pipes=[];
  score=0;
  frame=0;
  groundX=0;
  particles=[];
  state='play';
  updateBtn();
}

function updateBtn(){
  if(state==='start') tapBtn.innerHTML='🐦 ТАП — НАЧАТЬ';
  else if(state==='dead') tapBtn.innerHTML='🔄 ТАП — ЗАНОВО';
  else tapBtn.innerHTML='🐦 ТАП — ЛЕТЕТЬ';
}

// --- FLAP ---
function flap(){
  if(state==='start'){initGame();return;}
  if(state==='dead'){initGame();return;}
  bird.vy=FLAP_POWER;
  bird.flapped=true;
  spawnFlapParticles();
}

function spawnFlapParticles(){
  for(let i=0;i<5;i++){
    particles.push({
      x:bird.x-bird.r,
      y:bird.y+bird.r*0.5,
      vx:-1-Math.random()*2,
      vy:(Math.random()-0.5)*2,
      life:1,
      r:3+Math.random()*3,
      color:'rgba(255,255,255,0.7)'
    });
  }
}

function spawnDeathParticles(){
  for(let i=0;i<20;i++){
    const a=Math.random()*Math.PI*2;
    const sp=2+Math.random()*5;
    particles.push({
      x:bird.x,y:bird.y,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
      life:1,r:4+Math.random()*6,
      color:`hsl(${30+Math.random()*60},100%,60%)`
    });
  }
}

// --- PIPES ---
function spawnPipe(){
  const minTop=H*0.12;
  const maxTop=H-GROUND_H-PIPE_GAP-H*0.12;
  const topH=minTop+Math.random()*(maxTop-minTop);
  pipes.push({x:W+PIPE_W, topH, passed:false});
}

// --- DRAW HELPERS ---
function drawSky(){
  const sky=ctx.createLinearGradient(0,0,0,H-GROUND_H);
  sky.addColorStop(0,'#4a9fb5');
  sky.addColorStop(1,'#87ceeb');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H-GROUND_H);
}

function drawClouds(){
  // статичные облака — просто украшение
  const clouds=[
    {x:W*0.15,y:H*0.12,s:1},
    {x:W*0.55,y:H*0.08,s:0.8},
    {x:W*0.8, y:H*0.18,s:1.2},
  ];
  ctx.fillStyle='rgba(255,255,255,0.75)';
  clouds.forEach(c=>{
    const r=40*c.s;
    ctx.beginPath();ctx.ellipse(c.x,c.y,r,r*0.55,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x-r*0.45,c.y+r*0.2,r*0.6,r*0.4,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x+r*0.45,c.y+r*0.15,r*0.55,r*0.38,0,0,Math.PI*2);ctx.fill();
  });
}

function drawGround(){
  // движущаяся земля
  const groundY=H-GROUND_H;

  // трава
  ctx.fillStyle='#5d8a2f';
  ctx.fillRect(0,groundY,W,GROUND_H);

  // полоса
  ctx.fillStyle='#4a7025';
  ctx.fillRect(0,groundY,W,8);

  // текстура плиток
  ctx.fillStyle='#c8a96e';
  ctx.fillRect(0,groundY+10,W,GROUND_H-10);

  const tileW=48;
  const offset=groundX%tileW;
  ctx.strokeStyle='rgba(0,0,0,0.15)';
  ctx.lineWidth=1;
  for(let x=-tileW+offset;x<W+tileW;x+=tileW){
    ctx.beginPath();ctx.moveTo(x,groundY+10);ctx.lineTo(x,H);ctx.stroke();
  }
  ctx.beginPath();ctx.moveTo(0,groundY+10+20);ctx.lineTo(W,groundY+10+20);ctx.stroke();
}

function drawPipe(p){
  const grad=ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
  grad.addColorStop(0,'#4caf50');
  grad.addColorStop(0.4,'#81c784');
  grad.addColorStop(1,'#388e3c');

  const capH=20, capExtra=6;

  // верхняя труба
  ctx.fillStyle=grad;
  ctx.fillRect(p.x, 0, PIPE_W, p.topH-capH);
  // шапка верхней
  ctx.fillStyle='#388e3c';
  ctx.fillRect(p.x-capExtra, p.topH-capH, PIPE_W+capExtra*2, capH);
  // блик
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fillRect(p.x+4, 0, 10, p.topH-capH);

  // нижняя труба
  const botY=p.topH+PIPE_GAP;
  ctx.fillStyle=grad;
  ctx.fillRect(p.x, botY+capH, PIPE_W, H-botY-capH);
  // шапка нижней
  ctx.fillStyle='#388e3c';
  ctx.fillRect(p.x-capExtra, botY, PIPE_W+capExtra*2, capH);
  // блик
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fillRect(p.x+4, botY+capH, 10, H-botY-capH);
}

function drawBird(){
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  // тело
  ctx.fillStyle='#ffd600';
  ctx.beginPath();
  ctx.ellipse(0,0,bird.r,bird.r*0.85,0,0,Math.PI*2);
  ctx.fill();

  // крыло
  ctx.fillStyle='#ff9800';
  ctx.beginPath();
  ctx.ellipse(-4, 4, bird.r*0.55, bird.r*0.3, -0.4, 0, Math.PI*2);
  ctx.fill();

  // грудка
  ctx.fillStyle='#fff176';
  ctx.beginPath();
  ctx.ellipse(4, 2, bird.r*0.45, bird.r*0.55, 0.2, 0, Math.PI*2);
  ctx.fill();

  // клюв
  ctx.fillStyle='#ff6d00';
  ctx.beginPath();
  ctx.moveTo(bird.r*0.7, -2);
  ctx.lineTo(bird.r*1.2, 0);
  ctx.lineTo(bird.r*0.7, 4);
  ctx.closePath();
  ctx.fill();

  // глаз
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(bird.r*0.35,-bird.r*0.2,bird.r*0.28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.arc(bird.r*0.42,-bird.r*0.18,bird.r*0.14,0,Math.PI*2);ctx.fill();
  // блик
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(bird.r*0.46,-bird.r*0.25,bird.r*0.06,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vy+=0.15;
    p.life-=0.03;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}

function drawHUD(){
  // счёт
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  // тень
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.font='bold 44px Arial';
  ctx.fillText(score, W/2+2, 62);
  // текст
  ctx.fillStyle='#fff';
  ctx.fillText(score, W/2, 60);

  if(bestScore>0&&state==='play'){
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.font='16px Arial';
    ctx.fillText('Рекорд: '+bestScore, W/2, 95);
  }
}

function drawStartScreen(){
  drawSky();
  drawClouds();
  drawGround();

  // затемнение
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.fillRect(0,0,W,H);

  // панель
  const pw=Math.min(W-40,320), ph=220;
  const px=(W-pw)/2, py=H/2-ph/2-30;
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.beginPath();ctx.roundRect(px,py,pw,ph,24);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(px,py,pw,ph,24);ctx.stroke();

  // птица большая
  const savedX=bird.x, savedY=bird.y, savedR=bird.rot;
  bird.x=W/2; bird.y=py+60; bird.rot=Math.sin(frame*0.05)*0.15;
  drawBird();
  bird.x=savedX; bird.y=savedY; bird.rot=savedR;

  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle='#ffd600';
  ctx.font='bold 32px Arial';
  ctx.fillText('FLAPPY BIRD', W/2, py+115);

  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.font='15px Arial';
  ctx.fillText('нажми кнопку снизу чтобы лететь', W/2, py+150);

  if(bestScore>0){
    ctx.fillStyle='#ffd600';
    ctx.font='bold 18px Arial';
    ctx.fillText('🏆 Рекорд: '+bestScore, W/2, py+185);
  }
}

function drawDeadScreen(){
  // полупрозрачный оверлей
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,W,H);

  const pw=Math.min(W-40,300), ph=200;
  const px=(W-pw)/2, py=H/2-ph/2-40;

  ctx.fillStyle='rgba(255,255,255,0.1)';
  ctx.beginPath();ctx.roundRect(px,py,pw,ph,20);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.25)';
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(px,py,pw,ph,20);ctx.stroke();

  ctx.textAlign='center';
  ctx.textBaseline='middle';

  ctx.fillStyle='#ff4444';
  ctx.font='bold 28px Arial';
  ctx.fillText('GAME OVER', W/2, py+42);

  ctx.fillStyle='#fff';
  ctx.font='bold 20px Arial';
  ctx.fillText('Счёт: '+score, W/2, py+90);

  ctx.fillStyle='#ffd600';
  ctx.font='bold 18px Arial';
  ctx.fillText('🏆 Рекорд: '+bestScore, W/2, py+125);

  // медаль
  if(score>=10){
    const medal=score>=30?'🥇':score>=20?'🥈':'🥉';
    ctx.font='36px Arial';
    ctx.fillText(medal, W/2, py+168);
  }
}

// --- MAIN LOOP ---
let lastTime=0;
frame=0;

// инициализируем птицу для стартового экрана
bird={x:W*0.28,y:H*0.45,vy:0,r:18,rot:0};

function loop(ts){
  requestAnimationFrame(loop);
  const dt=ts-lastTime;
  if(dt<1000/60)return;
  lastTime=ts;
  frame++;

  ctx.clearRect(0,0,W,H);

  if(state==='start'){
    frame++;
    // птица покачивается на старте
    bird.y=H*0.4+Math.sin(frame*0.05)*15;
    drawStartScreen();
    return;
  }

  // --- PHYSICS ---
  if(state==='play'){
    bird.vy+=GRAVITY;
    bird.y+=bird.vy;
    bird.rot=Math.max(-0.5,Math.min(1.4,bird.vy*0.065));

    groundX-=PIPE_SPEED;

    // spawn pipes
    if(frame%PIPE_INTERVAL===0) spawnPipe();

    // move pipes
    for(let i=pipes.length-1;i>=0;i--){
      const p=pipes[i];
      p.x-=PIPE_SPEED;
      if(p.x<-PIPE_W-20){pipes.splice(i,1);continue;}

      // score
      if(!p.passed&&p.x+PIPE_W<bird.x){
        p.passed=true;
        score++;
      }

      // collision
      const bx=bird.x, by=bird.y, br=bird.r-4;
      const inX=bx+br>p.x&&bx-br<p.x+PIPE_W;
      if(inX&&(by-br<p.topH||by+br>p.topH+PIPE_GAP)){
        state='dead';
        if(score>bestScore)bestScore=score;
        spawnDeathParticles();
        updateBtn();
      }
    }

    // ground & ceiling
    if(bird.y+bird.r>=H-GROUND_H){
      bird.y=H-GROUND_H-bird.r;
      state='dead';
      if(score>bestScore)bestScore=score;
      spawnDeathParticles();
      updateBtn();
    }
    if(bird.y-bird.r<0) bird.y=bird.r;
  }

  // --- RENDER ---
  drawSky();
  drawClouds();

  pipes.forEach(p=>drawPipe(p));

  drawGround();
  drawBird();
  drawParticles();
  drawHUD();

  if(state==='dead') drawDeadScreen();
}

// --- INPUT ---
tapBtn.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
tapBtn.addEventListener('mousedown',e=>{e.preventDefault();flap();});

// тап по экрану (кроме кнопки) тоже работает
canvas.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
canvas.addEventListener('mousedown',flap);

// пробел на ПК
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.key===' '){e.preventDefault();flap();}
});

requestAnimationFrame(loop);
</script>
</body>
</html>
